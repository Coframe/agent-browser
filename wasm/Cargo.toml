[package]
name = "agent-browser-wasm"
version = "0.0.0"
edition = "2021"
description = "agent-browser built for wasm32-wasip1 hosts such as Cloudflare Workers"
license = "Apache-2.0"
publish = false
build = "build.rs"

[[bin]]
name = "agent-browser"
path = "src/main.rs"

# Mirrors [dependencies] in ../cli/Cargo.toml. build.rs fails when the two
# lists name different crates. Crates that need an OS are replaced by the
# shims in ./shims under the same name, so upstream sources compile unchanged.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
getrandom = "0.2"
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
image = "0.25"
sha2 = "0.10"
aes-gcm = "0.10"
async-trait = "0.1"
similar = "2"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting"] }
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
urlencoding = "2"
rust-embed = "8"
psl = "=2.1.246"
rustls-pemfile = "2"
webpki-roots = "0.26"
tokio = { package = "agent-browser-shim-tokio", path = "shims/tokio" }
tokio-tungstenite = { package = "agent-browser-shim-tokio-tungstenite", path = "shims/tokio-tungstenite" }
reqwest = { package = "agent-browser-shim-reqwest", path = "shims/reqwest" }
rustls = { package = "agent-browser-shim-rustls", path = "shims/rustls" }
rustls-native-certs = { package = "agent-browser-shim-rustls-native-certs", path = "shims/rustls-native-certs" }
socket2 = { package = "agent-browser-shim-socket2", path = "shims/socket2" }
agent-browser-host = { path = "shims/host" }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# For iterating: builds in a fraction of the time.
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = false

[workspace]
members = [".", "shims/*"]
