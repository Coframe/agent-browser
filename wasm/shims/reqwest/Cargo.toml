[package]
name = "agent-browser-shim-reqwest"
version = "0.0.0"
edition = "2021"
publish = false
description = "The subset of the reqwest API that agent-browser uses, over the JS host's fetch, for wasm32-wasip1"

[lib]
name = "reqwest"

[dependencies]
agent-browser-host = { path = "../host" }
rustls = { package = "agent-browser-shim-rustls", path = "../rustls" }
http = "1"
url = "2"
bytes = "1"
futures-util = "0.3"
serde = "1"
serde_json = "1"
serde_urlencoded = "0.7"
base64 = "0.22"
