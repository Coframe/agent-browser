[package]
name = "agent-browser-host"
version = "0.0.0"
edition = "2021"
publish = false
description = "Executor, timers, WebSockets and HTTP for agent-browser on wasm32-wasip1, backed by functions the JS host imports into the module"

[dependencies]
futures-channel = "0.3"
futures-executor = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
