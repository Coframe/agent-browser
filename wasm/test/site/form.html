<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture Form</title></head>
<body>
<h1>Sign up</h1>
<form id="f" onsubmit="event.preventDefault();document.getElementById('result').textContent='Submitted: '+new FormData(this).get('name')+' / '+new FormData(this).get('plan')+' / '+(new FormData(this).get('tos')?'tos':'no-tos');">
<label>Name <input name="name" id="name" placeholder="Your name"></label>
<label>Email <input name="email" id="email" type="email"></label>
<label>Plan <select name="plan" id="plan"><option value="free">Free</option><option value="pro">Pro</option></select></label>
<label><input type="checkbox" name="tos" id="tos"> Accept terms</label>
<textarea name="notes" id="notes" aria-label="Notes"></textarea>
<button type="submit">Create account</button>
</form>
<p id="result" role="status"></p>
<a href="/index.html">Home</a>
</body></html>
