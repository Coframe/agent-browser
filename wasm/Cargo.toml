[package]
name = "agent-browser-wasm-core"
version = "0.43.0"
edition = "2021"
description = "agent-browser command core compiled for wasm32 hosts such as Cloudflare Workers"
license = "Apache-2.0"
publish = false
build = "../cli/build.rs"

[lib]
name = "agent_browser"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "js"] }
image = "0.25"
sha2 = "0.10"
aes-gcm = "0.10"
async-trait = "0.1"
similar = "2"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting"] }
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
urlencoding = "2"
rust-embed = "8"
psl = "=2.1.246"
reqwest = { package = "agent-browser-shim-reqwest", path = "shims/reqwest" }
rustls = { package = "agent-browser-shim-rustls", path = "shims/rustls" }
rustls-native-certs = { package = "agent-browser-shim-rustls-native-certs", path = "shims/rustls-native-certs" }
rustls-pemfile = "2"
webpki-roots = "0.26"
tokio = { package = "agent-browser-shim-tokio", path = "shims/tokio" }
tokio-tungstenite = { package = "agent-browser-shim-tokio-tungstenite", path = "shims/tokio-tungstenite" }
socket2 = { package = "agent-browser-shim-socket2", path = "shims/socket2" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
members = [".", "shims/*"]
